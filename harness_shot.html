<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STARWEFT shot harness</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="strip">
  <div class="srow" id="stripMain">
    <button id="btnMenu" title="Menu" aria-label="Menu">☰</button>
    <div class="logo"><i>✦</i> STARWEFT</div>
    <div class="stat" data-info="ui:weave" id="stWeaveWrap">◈ <span id="stWeave">0</span></div>
    <div class="stat" data-info="ui:credits">¤ <span id="stCredits">0</span></div>
    <div class="stat" data-info="ui:research">◇ <span id="stResearch">0</span></div>
    <div class="stat" data-info="ui:fleet">▲ <span id="stFleet">0</span></div>
    <div class="stat" data-info="ui:infamy" id="stInfamyWrap" style="display:none">† <span id="stInfamy">0</span></div>
    <div class="stat">⧗ <span id="stTick">0</span></div>
    <div id="alerts"></div>
    <div class="spacer"></div>
    <div id="searchWrap">
      <input id="searchBox" placeholder="search systems…" autocomplete="off">
      <div id="searchResults" class="hidden"></div>
    </div>
    <div id="speedCtrls">
      <button id="spdPause" title="Pause (Space)" aria-label="Pause" aria-pressed="false">⏸</button>
      <button id="spd1" title="Normal (1)" aria-label="Normal speed">▶</button>
      <button id="spd3" title="Fast (2)" aria-label="Fast speed">▶▶</button>
      <button id="spd10" title="Very fast (3)" aria-label="Very fast speed">▶▶▶</button>
    </div>
    <button id="btnMore" title="More — development, market, codex, sound" aria-label="More controls" aria-expanded="false" data-info="ui:more">⋯</button>
  </div>
  <div class="srow" id="stripSub">
    <div id="objective"><b>◈</b> <span>…</span></div>
    <div id="ticker"></div>
  </div>
  <div class="srow hidden" id="stripMore">
    <button id="btnTech" title="Development — research tree, aptitudes and milestones in one place" data-info="ui:research">DEVELOPMENT</button>
    <button id="btnExchange" title="Exchange Terminal (requires research)" disabled>THE MARKET</button>
    <button id="btnCodex" title="Codex — ships, cast, chronicle">CODEX</button>
    <button id="btnMute" title="Sound effects" aria-label="Sound effects" aria-pressed="false">♪</button>
    <button id="btnMusic" title="Ambient music" aria-label="Ambient music" aria-pressed="false">∿</button>
  </div>
</div>

<div id="main">
  <canvas id="map"></canvas>
  <button id="btnBackGalaxy" class="hidden">← THE BUBBLE</button>
  <div id="sysPanel" class="panel hidden"></div>
  <div id="dock" class="panel">
    <div id="dockTabs">
      <button data-tab="fleet" class="active">Fleet</button>
      <button data-tab="routes">Routes</button>
      <button data-tab="ops">Ops</button>
      <button data-tab="pledges">Pledges</button>
      <button data-tab="you">You</button>
      <button data-tab="log">Journal</button>
      <button id="btnPinDock" data-act="pinDock" title="Pin the dock open" data-info="ui:pin" aria-pressed="false">▢</button>
    </div>
    <div id="dockBody"></div>
  </div>
  <div id="commandBar" class="panel hidden"></div>
  <div id="infobox" class="panel"></div>
  <div id="mapHint" class="hidden"></div>
  <div id="exchange" class="hidden"></div>
  <div id="techOverlay" class="hidden"></div>
</div>

<div id="toasts"></div>

<div id="modalShade" class="hidden">
  <div id="eventModal" class="modal hidden"></div>
  <div id="gameoverModal" class="modal hidden"></div>
  <div id="titleModal" class="modal hidden"></div>
  <div id="helpModal" class="modal hidden"></div>
  <div id="menuModal" class="modal hidden"></div>
  <div id="settingsModal" class="modal hidden"></div>
  <div id="importModal" class="modal hidden"></div>
  <div id="confirmModal" class="modal hidden"></div>
  <div id="cheatModal" class="modal hidden"></div>
  <div id="codexModal" class="modal wide hidden"></div>
  <div id="combatSim" class="modal hidden"></div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/perks.js"></script>
<script src="js/starcat.js"></script>
<script src="js/lore.js"></script>
<script src="js/events_data.js"></script>
<script src="js/planets.js"></script>
<script src="js/sites.js"></script>
<script src="js/galaxy.js"></script>
<script src="js/economy.js"></script>
<script src="js/ships.js"></script>
<script src="js/combat.js"></script>
<script src="js/rivals.js"></script>
<script src="js/scourge.js"></script>
<script src="js/tech.js"></script>
<script src="js/story.js"></script>
<script src="js/worldevents.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/quests.js"></script>
<script src="js/civics.js"></script>
<script src="js/pledges.js"></script>
<script src="js/acts.js"></script>
<script src="js/signals.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/portraits.js"></script>
<script src="js/codex.js"></script>
<script src="js/render.js"></script>
<script src="js/market_analytics.js"></script>
<script src="js/ui_market.js"></script>
<script src="js/ui_ship.js"></script>
<script src="js/ui_system.js"></script>
<script src="js/ui_routes.js"></script>
<script src="js/ui_pledge.js"></script>
<script src="js/ui_tech.js"></script>
<script src="js/ui_modals.js"></script>
<script src="js/ui.js"></script>
<script>
/* shot harness: boot straight into a live acts run, no title, no boot crawl */
(function () {
  const G = SW.game;
  G.handlers.toast = function (t) { SW.ui.toast(t); };
  G.handlers.event = function () { /* keep the map clear for the shot */ };
  G.handlers.sfx = function () {};
  G.handlers.gameover = function () {};
  G.handlers.objective = function () {};
  SW.render.init(document.getElementById('map'));
  SW.ui.init();
  G.newGame({ seed: 'shot-f2', difficulty: 'standard', acts: true });
  SW.ui.afterLoad();
  SW.ui.hideModals();
  for (let i = 0; i < 30; i++) G.tick(G.state);
  if (location.hash === '#beacons') {
    const st = G.state;
    st.systems.filter(function (x) { return x.pop > 0 && x.id !== st.homeId; }).slice(0, 4).forEach(function (x) { x.discovered = true; });
    SW.pledges.refreshBoard(st);
    const away = st.systems.find(function (x) { return x.discovered && x.id !== st.homeId; });
    if (away) { away.scourge = 1; away.threatAt = st.tick + 100; }
    const sh = st.ships[0]; if (sh) sh.stranded = true;
    SW.render.selectedSys = null;
    SW.render.cam.dist = 260; SW.render.cam.distTarget = 260;
  }
  G.state.paused = true;
  SW.ui.refresh();
  if (location.hash === '#more') SW.ui.toggleMore(true);
  G.startLoop();
})();
</script>
</body>
</html>
